name: python-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    container: python:${{ matrix.python-version }}-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e packages/analytics-os pytest
      - run: pytest
