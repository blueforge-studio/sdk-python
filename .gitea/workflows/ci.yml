name: python-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps + run tests (Python ${{ matrix.python-version }})
        uses: docker://python:${{ matrix.python-version }}-slim
        with:
          args: sh -c "pip install -e packages/analytics-os pytest && pytest"
