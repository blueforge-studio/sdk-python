name: python-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-3.10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps + run tests (Python 3.10)
        uses: docker://python:3.10-slim
        with:
          args: sh -c "pip install -e packages/analytics-os pytest && pytest"

  test-3.11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps + run tests (Python 3.11)
        uses: docker://python:3.11-slim
        with:
          args: sh -c "pip install -e packages/analytics-os pytest && pytest"

  test-3.12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps + run tests (Python 3.12)
        uses: docker://python:3.12-slim
        with:
          args: sh -c "pip install -e packages/analytics-os pytest && pytest"
