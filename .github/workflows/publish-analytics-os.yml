name: publish-analytics-os
on:
  push:
    tags: ["analytics-os-v*.*.*"]

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build hatchling
      - name: Build
        working-directory: packages/analytics-os
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/analytics-os/dist/
